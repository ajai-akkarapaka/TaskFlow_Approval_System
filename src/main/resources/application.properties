# Load local development variables from the repository .env file when present.
spring.config.import=optional:file:.env[.properties]

# Dynamic port requirement for cloud hosting platforms
server.port=${PORT:8080}
# MySQL Connection Details
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Hibernate setup for MySQL 8
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.forward-headers-strategy=framework

# Test-only HTTP Basic credentials for REST APIs. Override these in shared environments.
taskflow.security.username=${API_AUTH_USERNAME}
taskflow.security.password=${API_AUTH_PASSWORD}